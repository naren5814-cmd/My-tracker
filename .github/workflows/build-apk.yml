name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o -q "$(ls *.zip | head -1)" -d extracted

      - name: Build APK
        run: |
          set -e
          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
          cd "$(dirname "$PUBSPEC")"

          # 1. Save the custom Android files
          mkdir -p /tmp/custom
          cp -r android/app/src/main /tmp/custom/main

          # 2. Generate the missing Android scaffolding (gradle, v2 embedding, icons, styles)
          flutter create . --platforms=android --org com.example --project-name tnpsc_study_tracker

          # 3. Restore the custom files (manifest, widget, MainActivity)
          cp -r /tmp/custom/main/. android/app/src/main/

          # 4. Enable core library desugaring (needed by flutter_local_notifications)
          python3 - << 'PY'
          import os, re
          kts = "android/app/build.gradle.kts"
          grv = "android/app/build.gradle"
          if os.path.exists(kts):
              s = open(kts).read()
              if "isCoreLibraryDesugaringEnabled" not in s:
                  s = re.sub(r"compileOptions\s*\{", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", s, count=1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              if "isMinifyEnabled" not in s:
                  s = re.sub(r"release\s*\{", "release {\n            isMinifyEnabled = false\n            isShrinkResources = false", s, count=1)
              open(kts, "w").write(s)
          elif os.path.exists(grv):
              s = open(grv).read()
              if "coreLibraryDesugaringEnabled" not in s:
                  s = re.sub(r"compileOptions\s*\{", "compileOptions {\n        coreLibraryDesugaringEnabled true", s, count=1)
                  s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
                  open(grv, "w").write(s)
          PY

          # 5. Build
          flutter pub get
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tnpsc-study-tracker-apk
          path: out/app-release.apk
